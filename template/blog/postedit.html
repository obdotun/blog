
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>
    <!-- Add Bootstrap or your custom CSS here -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Include CKEditor -->
    <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Create a New Blog Post</h1>

        <!-- Display error messages -->
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form action="{% url 'editpost' post.id%}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h3 class="mt-4 mb-4">Create Blog</h3>

            <!-- Title Field -->
            <label for="postname" class="form-label">Title</label>
            <div class="input-group">
                <input type="text" class="form-control" name="postname" id="postname" value="{{post.postname}}">
            </div>

            <!-- Content Field -->
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" name="content" required id="content">{{post.content}}</textarea>
            <br>

            <!-- Category Field -->
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" name="category" id="category" >
            <br>

            <!-- Image Upload Field -->
            <label for="image" class="form-label">Upload Image</label>
            <input type="file" class="form-control" name="image" id="image">
            <br>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Create Post</button>
            <br>

            <!-- Display Django messages -->
            {% for message in messages %}
                <p class="text-danger">{{ message }}</p>
            {% endfor %}
        </form>
    </div>

    <!-- Initialize CKEditor -->
    <script>
        CKEDITOR.replace('content');
    </script>
</body>
</html>
